name: backfill-effis-severity

# Fill real Sentinel-2 dNBR severity onto CAT EFFIS footprints (2025/2026).
# Does NOT drop non-CAT EFFIS; does NOT invent proxy severity; does NOT touch
# Sentinel scars or Bolets Explorador HTML.

"on":
  workflow_dispatch:
    inputs:
      years:
        description: "Anys a omplir (coma-separats)"
        required: true
        type: string
        default: "2025,2026"
      max_features:
        description: "Límit de features CAT per any (0 = totes, les més grans primer)"
        required: false
        type: string
        default: "0"
      force:
        description: "Recalcular encara que ja hi hagi dNBR real"
        required: false
        type: boolean
        default: false

concurrency:
  group: backfill-effis-severity
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      YEARS: ${{ github.event.inputs.years }}
      MAX_FEATURES: ${{ github.event.inputs.max_features }}
      FORCE_FLAG: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libs for rasterio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libexpat1 gdal-bin libgdal-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Baseline severity stats (before)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          import geopandas as gpd

          CAT = {"Barcelona", "Girona", "Lleida", "Tarragona"}
          pq = Path("docs/burned_cells.parquet")
          df = pd.read_parquet(pq)
          out = {}
          for y in (2025, 2026):
              sub = df[df.burn_year == y]
              cat_ids = set()
              ef = Path(f"scars/effis_{y}.geojson")
              if ef.exists():
                  g = gpd.read_file(ef)
                  cols = {c.upper(): c for c in g.columns}
                  if "COUNTRY" in cols and "PROVINCE" in cols:
                      m = (g[cols["COUNTRY"]].astype(str).str.upper() == "ES") & (
                          g[cols["PROVINCE"]].astype(str).isin(CAT)
                      )
                      cat_ids = set(g.loc[m, "id"].astype(str))
              eff = sub[sub.source == "effis"]
              cat_eff = eff[eff.fire_id.astype(str).isin(cat_ids)] if cat_ids else eff.iloc[0:0]
              sent = sub[sub.source == "sentinel"]
              out[str(y)] = {
                  "total_cells": int(len(sub)),
                  "sentinel_cells": int(len(sent)),
                  "sentinel_with_sev": int(sent["severity"].notna().sum()),
                  "effis_cells": int(len(eff)),
                  "effis_with_sev": int(eff["severity"].notna().sum()),
                  "cat_effis_cells": int(len(cat_eff)),
                  "cat_effis_with_sev": int(cat_eff["severity"].notna().sum()),
                  "cat_effis_null": int(cat_eff["severity"].isna().sum()),
              }
          Path(".tmp").mkdir(exist_ok=True)
          Path(".tmp/stats_before.json").write_text(json.dumps(out, indent=2) + "\n")
          print(json.dumps(out, indent=2))
          PY

      - name: Backfill EFFIS severity (CDSE openEO)
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          echo "years=${YEARS} max_features=${MAX_FEATURES} force='${FORCE_FLAG}'"
          python scripts/backfill_effis_severity.py \
            --years "${YEARS}" \
            --max-features "${MAX_FEATURES}" \
            --post-windows 2 \
          # Skip per-AOI WorldCover CDSE jobs (halves runtime); dNBR still real.
            --min-ha 1 \
            --no-forest-mask \
            ${FORCE_FLAG}

      - name: Upload backfill stats artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: effis-severity-backfill-stats
          path: |
            .tmp/effis_sev_backfill/stats_*.json
            .tmp/stats_before.json
            .tmp/stats_after.json
          if-no-files-found: ignore

      - name: Commit updated EFFIS scars (no docs yet)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only stage EFFIS geojson for requested years — never touch sentinel
          IFS=',' read -ra YARR <<< "${YEARS}"
          files=()
          for y in "${YARR[@]}"; do
            y=$(echo "$y" | tr -d ' ')
            files+=("scars/effis_${y}.geojson")
          done
          git add "${files[@]}" 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No EFFIS scar changes to commit"
          else
            git commit -m "data: EFFIS CAT severity dNBR backfill (${YEARS}) [skip ci]"
            git stash push -u -m "backfill-effis-pre-rebase" || true
            for i in 1 2 3 4 5; do
              git fetch origin main
              git stash push -u -m "backfill-effis-rebase-$i" || true
              if git rebase origin/main; then
                git push origin HEAD:main
                git stash clear || true
                exit 0
              fi
              echo "Rebase conflict attempt $i — prefer ours for EFFIS we just wrote"
              for y in "${YARR[@]}"; do
                y=$(echo "$y" | tr -d ' ')
                # During rebase: theirs = our commit being applied
                git checkout --theirs "scars/effis_${y}.geojson" 2>/dev/null || true
                git add "scars/effis_${y}.geojson" 2>/dev/null || true
              done
              # Prefer upstream docs/sentinel artifacts if they collide
              git checkout --ours docs/burned_cells.parquet docs/burned_cells.geojson docs/manifest.json 2>/dev/null || true
              git checkout --ours scars/sentinel_*.geojson 2>/dev/null || true
              git add docs/ scars/sentinel_*.geojson 2>/dev/null || true
              GIT_EDITOR=true git rebase --continue || git rebase --abort || true
              sleep $((i * 3))
            done
            git stash clear || true
            echo "Failed to push EFFIS scars after retries" >&2
            exit 1
          fi

      - name: Rebuild burned cells + publish docs
        run: |
          set -euo pipefail
          git pull --ff-only origin main || git pull --rebase origin main
          # reference_year = max requested year
          REF=$(python - <<'PY'
          import os
          ys = [int(x.strip()) for x in os.environ["YEARS"].split(",") if x.strip()]
          print(max(ys) if ys else 2026)
          PY
          )
          python scripts/build_burned_cells.py --reference-year "${REF}"
          python scripts/publish_docs.py --reference-year "${REF}"
          if [ -f scripts/build_recent_burns.py ]; then
            python scripts/build_recent_burns.py --reference-year "${REF}" || true
          fi

      - name: After stats
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          import geopandas as gpd

          CAT = {"Barcelona", "Girona", "Lleida", "Tarragona"}
          df = pd.read_parquet("docs/burned_cells.parquet")
          out = {}
          for y in (2025, 2026):
              sub = df[df.burn_year == y]
              cat_ids = set()
              ef = Path(f"scars/effis_{y}.geojson")
              if ef.exists():
                  g = gpd.read_file(ef)
                  cols = {c.upper(): c for c in g.columns}
                  if "COUNTRY" in cols and "PROVINCE" in cols:
                      m = (g[cols["COUNTRY"]].astype(str).str.upper() == "ES") & (
                          g[cols["PROVINCE"]].astype(str).isin(CAT)
                      )
                      cat_ids = set(g.loc[m, "id"].astype(str))
              eff = sub[sub.source == "effis"]
              cat_eff = eff[eff.fire_id.astype(str).isin(cat_ids)] if cat_ids else eff.iloc[0:0]
              sent = sub[sub.source == "sentinel"]
              sev_counts = (
                  cat_eff["severity"].fillna("NULL").value_counts().to_dict()
                  if len(cat_eff)
                  else {}
              )
              out[str(y)] = {
                  "total_cells": int(len(sub)),
                  "sentinel_cells": int(len(sent)),
                  "sentinel_with_sev": int(sent["severity"].notna().sum()),
                  "effis_cells": int(len(eff)),
                  "effis_with_sev": int(eff["severity"].notna().sum()),
                  "cat_effis_cells": int(len(cat_eff)),
                  "cat_effis_with_sev": int(cat_eff["severity"].notna().sum()),
                  "cat_effis_null": int(cat_eff["severity"].isna().sum()),
                  "cat_effis_severity_counts": {str(k): int(v) for k, v in sev_counts.items()},
              }
          Path(".tmp/stats_after.json").write_text(json.dumps(out, indent=2) + "\n")
          print(json.dumps(out, indent=2))
          before = json.loads(Path(".tmp/stats_before.json").read_text())
          for y in ("2025", "2026"):
              b, a = before[y], out[y]
              print(
                  f"DELTA {y}: cat_effis_with_sev {b['cat_effis_with_sev']}→{a['cat_effis_with_sev']} "
                  f"(+{a['cat_effis_with_sev']-b['cat_effis_with_sev']}); "
                  f"total_cells {b['total_cells']}→{a['total_cells']}; "
                  f"sentinel_with_sev {b['sentinel_with_sev']}→{a['sentinel_with_sev']}"
              )
          PY

      - name: Commit docs product
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/burned_cells.parquet docs/burned_cells.geojson docs/manifest.json
          git add docs/recent_burns.bin.gz 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No docs changes"
            exit 0
          fi
          git commit -m "data: docs after EFFIS severity backfill (${YEARS}) [skip ci]"
          git stash push -u -m "backfill-docs-pre-rebase" || true
          for i in 1 2 3 4 5; do
            git fetch origin main
            git stash push -u -m "backfill-docs-rebase-$i" || true
            if git rebase origin/main; then
              git push origin HEAD:main
              git stash clear || true
              exit 0
            fi
            # Binary docs: keep the just-rebuilt copy (theirs during rebase)
            git checkout --theirs docs/burned_cells.parquet docs/burned_cells.geojson docs/manifest.json 2>/dev/null || true
            git checkout --theirs docs/recent_burns.bin.gz 2>/dev/null || true
            git add docs/burned_cells.parquet docs/burned_cells.geojson docs/manifest.json docs/recent_burns.bin.gz 2>/dev/null || true
            GIT_EDITOR=true git rebase --continue || git rebase --abort || true
            sleep $((i * 3))
          done
          git stash clear || true
          echo "Failed to push docs after retries" >&2
          exit 1

      - name: Avisa per correu (issue + @mention)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const years = '${{ env.YEARS }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = ok
              ? `Cicatrius: backfill EFFIS severity (${years}) OK`
              : `Cicatrius: backfill EFFIS severity (${years}) FALLADA`;
            const body = [
              '@jnoya99',
              '',
              ok
                ? `L'Action **backfill-effis-severity** (${years}) ha acabat **bé**.`
                : `L'Action **backfill-effis-severity** (${years}) ha **fallat**.`,
              '',
              `Run: ${runUrl}`,
              `Manifest: https://jnoya99.github.io/cat-cicatrius/manifest.json`,
              '',
              'Només s\'ha omplert severitat dNBR real a EFFIS dins Catalunya; no s\'han esborrat cel·les EFFIS ni inventat proxies.',
              '',
              '_Issue automàtic per generar el correu de GitHub; es tanca tot seguit._',
            ].join('\n');
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['avis-estacional'],
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.data.number,
              state: 'closed',
            });
            core.info(`Issue #${issue.data.number} creada i tancada`);
