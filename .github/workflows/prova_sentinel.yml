name: prova-sentinel

# Manual dual tests: Sentinel-2 dNBR via CDSE openEO (secrets only).
# Default max_aois=0 (unlimited): all seeds with area > min-seed-ha.
# Prefer a small max_aois only for credit-limited smoke tests.

"on":
  workflow_dispatch:
    inputs:
      year:
        description: "Any de cicatrius (2024 validació; 2025; 2026 temporada actual)"
        required: true
        type: choice
        options:
          - "2024"
          - "2025"
          - "2026"
        default: "2024"
      max_aois:
        description: "Màxim d'AOIs (les més grans primer); 0 = sense límit"
        required: false
        type: string
        default: "0"

concurrency:
  group: prova-sentinel  # una sola prova a la vegada (evita conflictes docs/)
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  prova:
    runs-on: ubuntu-latest
    env:
      YEAR: ${{ github.event.inputs.year }}
      MAX_AOIS: ${{ github.event.inputs.max_aois }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libs for rasterio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libexpat1 gdal-bin libgdal-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch official SHP for year (best-effort)
        run: python scripts/fetch_official_shp.py --years ${{ env.YEAR }}
        continue-on-error: true

      - name: Ingest Gencat events (best-effort, for point seeds)
        run: python scripts/ingest_gencat.py
        continue-on-error: true

      - name: Fetch EFFIS for year (same-year only; rolling layer fallback)
        run: python scripts/fetch_effis.py --years ${YEAR}
        continue-on-error: true

      - name: Sentinel-2 dNBR (CDSE openEO)
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
        run: |
          echo "Running map_scars_openeo.py --year ${YEAR} --max-aois ${MAX_AOIS} --threshold-core 0.35 --threshold-grow 0.22 --post-windows 2 --min-seed-ha 1 --prefer-official --forest-mask"
          python scripts/map_scars_openeo.py \
            --year "${YEAR}" \
            --max-aois "${MAX_AOIS}" \
            --threshold-core 0.35 \
            --threshold-grow 0.22 \
            --min-ha 1.0 \
            --min-seed-ha 1.0 \
            --post-windows 2 \
            --prefer-official \
            --forest-mask \
            --morph-core

      - name: Validate vs official (2024 only)
        if: env.YEAR == '2024'
        run: python scripts/validate_against_official.py --year 2024

      - name: Upload sentinel scars (backup si falla el push)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-${{ env.YEAR }}
          path: |
            scars/sentinel_${{ env.YEAR }}.geojson
            scars/sentinel_${{ env.YEAR }}_*.geojson
            docs/validation_${{ env.YEAR }}.*
          if-no-files-found: ignore

      - name: Commit scars (sense docs binaris)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          files=(scars/sentinel_${YEAR}.geojson scars/sentinel_${YEAR}_*.geojson)
          if [ "${YEAR}" = "2024" ]; then
            files+=(docs/validation_2024.json docs/validation_2024.md)
          fi
          # Stage new/updated scars + deletions of stale per-AOI files
          git add -A -- scars/ 2>/dev/null || true
          git add "${files[@]}" 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No scars to commit"
          else
            git commit -m "data: scars sentinel ${YEAR} (max_aois=${MAX_AOIS}) [skip ci]"
            # fetch_official/effis leave unstaged/untracked dirt that blocks rebase
            git stash push -u -m "prova-sentinel-pre-rebase" || true
            for i in 1 2 3 4 5; do
              git fetch origin main
              # Re-stash any dirt that reappeared (e.g. after conflict checkout)
              git stash push -u -m "prova-sentinel-rebase-attempt-$i" || true
              if git rebase origin/main; then
                git push origin HEAD:main
                git stash clear || true
                exit 0
              fi
              echo "Rebase conflict on attempt $i — keep our year scars, drop conflicting docs"
              git checkout --ours scars/sentinel_${YEAR}.geojson scars/sentinel_${YEAR}_*.geojson 2>/dev/null || true
              git checkout --theirs docs/burned_cells.parquet docs/burned_cells.geojson docs/manifest.json 2>/dev/null || true
              git add scars/sentinel_${YEAR}.geojson scars/sentinel_${YEAR}_*.geojson 2>/dev/null || true
              git add docs/validation_2024.json docs/validation_2024.md 2>/dev/null || true
              GIT_EDITOR=true git rebase --continue || git rebase --abort || true
              sleep $((i * 3))
            done
            git stash clear || true
            echo "Failed to push scars after retries" >&2
            exit 1
          fi

      - name: Build burned cells on app 0.001° grid
        run: |
          git pull --ff-only origin main || git pull --rebase origin main
          python scripts/build_burned_cells.py --reference-year "${YEAR}"

      - name: Publish docs/ + manifest
        run: python scripts/publish_docs.py --reference-year "${YEAR}"

      - name: Commit docs product
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/burned_cells.parquet docs/burned_cells.geojson docs/manifest.json
          if git diff --staged --quiet; then
            echo "No docs changes"
            exit 0
          fi
          git commit -m "data: docs after sentinel ${YEAR} [skip ci]"
          # fetch_official/effis leave unstaged/untracked dirt that blocks rebase
          git stash push -u -m "prova-sentinel-docs-pre-rebase" || true
          for i in 1 2 3 4 5; do
            git fetch origin main
            git stash push -u -m "prova-sentinel-docs-rebase-attempt-$i" || true
            if git rebase origin/main; then
              git push origin HEAD:main
              git stash clear || true
              exit 0
            fi
            # Binary docs: keep the just-rebuilt copy
            git checkout --ours docs/burned_cells.parquet docs/burned_cells.geojson docs/manifest.json
            git add docs/burned_cells.parquet docs/burned_cells.geojson docs/manifest.json
            GIT_EDITOR=true git rebase --continue || git rebase --abort || true
            sleep $((i * 3))
          done
          git stash clear || true
          echo "Failed to push docs after retries" >&2
          exit 1

      - name: Avisa per correu de GitHub (issue + @mention)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const year = '${{ env.YEAR }}';
            const maxAois = '${{ env.MAX_AOIS }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = ok
              ? `Cicatrius: prova-sentinel ${year} OK`
              : `Cicatrius: prova-sentinel ${year} FALLADA`;
            const body = [
              '@jnoya99',
              '',
              ok
                ? `L'Action **prova-sentinel** (${year}, max_aois=${maxAois}) ha acabat **bé**.`
                : `L'Action **prova-sentinel** (${year}, max_aois=${maxAois}) ha **fallat**.`,
              '',
              `Run: ${runUrl}`,
              `Manifest: https://jnoya99.github.io/cat-cicatrius/manifest.json`,
              year === '2024'
                ? 'Validació: `docs/validation_2024.json` / `docs/validation_2024.md`'
                : 'Llavors mateixa any només (EFFIS rolling / oficial / Gencat municipi); finestres post retallades a avui (UTC).',
              '',
              '_Issue automàtic per generar el correu de GitHub; es tanca tot seguit._',
            ].join('\n');
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['avis-estacional'],
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.data.number,
              state: 'closed',
            });
            core.info(`Issue #${issue.data.number} creada i tancada (correu via @mention)`);
