name: prova-sentinel

# Manual dual tests: Sentinel-2 dNBR via CDSE openEO (secrets only).
# Prefer small max_aois first to save credits/time.

"on":
  workflow_dispatch:
    inputs:
      year:
        description: "Any de cicatrius (2024 validació oficial; 2026 temporada actual)"
        required: true
        type: choice
        options:
          - "2024"
          - "2026"
        default: "2024"
      max_aois:
        description: "Màxim d'AOIs (les més grans primer)"
        required: false
        type: string
        default: "12"

concurrency:
  group: prova-sentinel-${{ github.event.inputs.year }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  prova:
    runs-on: ubuntu-latest
    env:
      CDSE_USER: ${{ secrets.CDSE_USER }}
      CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
      YEAR: ${{ github.event.inputs.year }}
      MAX_AOIS: ${{ github.event.inputs.max_aois }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libs for rasterio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libexpat1 gdal-bin libgdal-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch official SHP for year (best-effort)
        run: python scripts/fetch_official_shp.py --years ${{ env.YEAR }}
        continue-on-error: true

      - name: Fetch EFFIS for year (+ year-1 seed if 2026)
        run: |
          if [ "${YEAR}" = "2026" ]; then
            python scripts/fetch_effis.py --years 2026 2025
          else
            python scripts/fetch_effis.py --years ${YEAR}
          fi
        continue-on-error: true

      - name: Sentinel-2 dNBR (CDSE openEO)
        run: |
          echo "Running map_scars_openeo.py --year ${YEAR} --max-aois ${MAX_AOIS}"
          python scripts/map_scars_openeo.py --year "${YEAR}" --max-aois "${MAX_AOIS}"

      - name: Validate vs official (2024 only)
        if: env.YEAR == '2024'
        run: python scripts/validate_against_official.py --year 2024

      - name: Build burned cells on app 0.001° grid
        run: python scripts/build_burned_cells.py --reference-year "${YEAR}"

      - name: Publish docs/ + manifest
        run: python scripts/publish_docs.py --reference-year "${YEAR}"

      - name: Commit docs/scars if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Avoid fatal pathspec when sentinel_*.geojson does not exist yet
          shopt -s nullglob
          git add docs/ || true
          git add scars/*.geojson || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: prova sentinel ${YEAR} (max_aois=${MAX_AOIS}) [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Avisa per correu de GitHub (issue + @mention)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const year = '${{ env.YEAR }}';
            const maxAois = '${{ env.MAX_AOIS }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = ok
              ? `Cicatrius: prova-sentinel ${year} OK`
              : `Cicatrius: prova-sentinel ${year} FALLADA`;
            const body = [
              '@jnoya99',
              '',
              ok
                ? `L'Action **prova-sentinel** (${year}, max_aois=${maxAois}) ha acabat **bé**.`
                : `L'Action **prova-sentinel** (${year}, max_aois=${maxAois}) ha **fallat**.`,
              '',
              `Run: ${runUrl}`,
              `Manifest: https://jnoya99.github.io/cat-cicatrius/manifest.json`,
              year === '2024'
                ? 'Validació: `docs/validation_2024.json` / `docs/validation_2024.md`'
                : 'Nota 2026: si falta EFFIS/oficial de l\'any, es fan servir llavors year-1 + finestres estacionals.',
              '',
              '_Issue automàtic per generar el correu de GitHub; es tanca tot seguit._',
            ].join('\n');
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['avis-estacional'],
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.data.number,
              state: 'closed',
            });
            core.info(`Issue #${issue.data.number} creada i tancada (correu via @mention)`);
